<link rel="manifest" href="data:application/manifest+json,%7B%22name%22%3A%22%ED%8F%AC%EC%BC%93%EB%AA%AC%20%ED%95%9C%EA%B8%80%EC%93%B0%EA%B8%B0%22%2C%22short_name%22%3A%22%ED%95%9C%EA%B8%80%EC%93%B0%EA%B8%B0%22%2C%22start_url%22%3A%22.%22%2C%22scope%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22orientation%22%3A%22portrait%22%2C%22background_color%22%3A%22%23fff6e3%22%2C%22theme_color%22%3A%22%23e3350d%22%2C%22lang%22%3A%22ko%22%7D">
<style>
  :root{
    --red:#ef4123; --red-dark:#c62a12; --ink:#23272f; --muted:#7a8496;
    --cream:#fff6e3; --card:#ffffff; --line:#e9eef6;
    --yellow:#ffd042; --yellow-dark:#d99b00;
    --green:#34cf6e; --green-dark:#149a48;
    --blue:#3aa6f5; --blue-dark:#1b7ec4;
    --shadow-soft:0 4px 0 #e9e0cc, 0 10px 22px rgba(120,90,40,.07);
    --radius:24px;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; height:100%; }
  body{
    font-family:-apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans CJK KR", "Malgun Gothic", system-ui, sans-serif;
    color:var(--ink);
    background:
      radial-gradient(120% 60% at 12% -10%, #ffecb8 0%, rgba(255,236,184,0) 60%),
      radial-gradient(90% 50% at 95% 8%, #d8f0ff 0%, rgba(216,240,255,0) 55%),
      var(--cream);
    -webkit-user-select:none; user-select:none;
    -webkit-touch-callout:none;
    overscroll-behavior:none;
  }
  .app{
    height:100vh; height:100dvh; display:flex; flex-direction:column;
    overflow:hidden; padding-top:env(safe-area-inset-top);
  }
  /* ── header ─────────────────────────────── */
  .topbar{
    display:flex; align-items:center; gap:10px; padding:10px 14px 12px;
    background:linear-gradient(180deg,#f5502f 0%, #e3350d 100%);
    border-radius:0 0 26px 26px;
    box-shadow:0 6px 0 #b92a10, 0 12px 22px rgba(200,50,20,.20);
    color:#fff; z-index:2;
  }
  .brand{ display:flex; align-items:center; gap:10px; min-width:0; flex:1; }
  .brand svg{ width:40px; height:40px; flex:0 0 auto; filter:drop-shadow(0 2px 3px rgba(0,0,0,.18)); }
  .brand h1{ font-size:19px; line-height:1.1; margin:0; letter-spacing:-.5px; font-weight:900; }
  .brand p{ margin:3px 0 0; font-size:11.5px; font-weight:700; color:#ffd9cf; letter-spacing:-.2px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .stickerBtn{
    display:flex; align-items:center; gap:6px; border:0; border-radius:999px;
    background:#fff; color:var(--red); padding:9px 14px 9px 11px; font-weight:900; font-size:15px;
    box-shadow:0 3px 0 rgba(0,0,0,.18); font-family:inherit; touch-action:manipulation;
  }
  .stickerBtn:active{ transform:translateY(2px); box-shadow:0 1px 0 rgba(0,0,0,.18); }
  .stickerBtn .ball{ width:22px; height:22px; display:block; }
  /* ── tabs ───────────────────────────────── */
  .tabs{ display:flex; gap:9px; padding:12px 14px 4px; flex:0 0 auto; }
  .tab{
    flex:1; border:0; font-family:inherit; font-size:15px; font-weight:900; letter-spacing:-.4px;
    padding:13px 8px; border-radius:19px; background:#fff; color:#8b95a8;
    box-shadow:0 3px 0 #e7ecf4; transition:transform .07s ease, background .18s, color .18s;
    touch-action:manipulation;
  }
  .tab.active{ background:linear-gradient(180deg,#ffd95e,#ffb700); color:#6b4400; box-shadow:0 4px 0 var(--yellow-dark); }
  .tab:active{ transform:translateY(2px); }
  /* ── strip ──────────────────────────────── */
  .strip{
    display:flex; align-items:center; gap:8px; overflow-x:auto; overflow-y:hidden;
    padding:10px 14px 12px; flex:0 0 auto; scrollbar-width:none; -webkit-overflow-scrolling:touch;
  }
  .strip::-webkit-scrollbar{ display:none; }
  .grp{
    flex:0 0 auto; font-size:11px; font-weight:900; color:#b0956a; background:#fff2d2;
    padding:5px 8px; border-radius:9px; letter-spacing:-.2px; align-self:center;
  }
  .chip{
    flex:0 0 auto; position:relative; border:0; font-family:inherit; cursor:pointer;
    height:58px; min-width:54px; padding:0 12px; border-radius:18px; background:#fff;
    font-size:25px; font-weight:900; color:#424c63; box-shadow:0 3px 0 #e7ecf4;
    display:flex; align-items:center; justify-content:center; touch-action:manipulation;
  }
  .chip:active{ transform:translateY(2px); }
  .chip.active{ background:linear-gradient(180deg,#7fd6ff,#31a4f2); color:#fff; box-shadow:0 4px 0 var(--blue-dark); }
  .chip .star{ position:absolute; top:-7px; right:-5px; font-size:15px; filter:drop-shadow(0 1px 1px rgba(0,0,0,.2)); }
  .chip.pk{ height:66px; min-width:64px; padding:4px 8px 5px; flex-direction:column; gap:0; font-size:12px; font-weight:900; }
  .chip.pk img{ width:40px; height:40px; object-fit:contain; }
  .chip.pk span{ max-width:60px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .chip.pk.active span{ color:#fff; }
  /* ── buddy card ─────────────────────────── */
  .buddy{
    display:flex; align-items:center; gap:10px; margin:0 14px 10px; padding:9px 12px;
    background:var(--card); border-radius:22px; box-shadow:var(--shadow-soft); flex:0 0 auto;
  }
  .buddy .art{ width:72px; height:72px; flex:0 0 auto; display:flex; align-items:center; justify-content:center; }
  .buddy .art img{ width:100%; height:100%; object-fit:contain; }
  .buddy .who{ flex:1; min-width:0; }
  .buddy .big{ font-size:36px; font-weight:900; line-height:1; letter-spacing:-1px; color:#e3350d; }
  .buddy .pname{ font-size:20px; font-weight:900; letter-spacing:-.6px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .buddy .tag{ font-size:11.5px; font-weight:800; color:var(--muted); margin-top:2px; letter-spacing:-.2px;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .snd{ display:flex; flex-direction:column; gap:6px; flex:0 0 auto; }
  .snd button{
    border:0; font-family:inherit; font-weight:900; font-size:12.5px; color:#334; white-space:nowrap;
    background:#eef6ff; border-radius:13px; padding:9px 11px; box-shadow:0 3px 0 #d7e6f7; touch-action:manipulation;
    display:flex; align-items:center; gap:4px;
  }
  .snd button.cry{ background:#fff2e6; box-shadow:0 3px 0 #f6dfc7; }
  .snd button:active{ transform:translateY(2px); box-shadow:none; }
  /* ── stage ──────────────────────────────── */
  .stage{ flex:1 1 auto; min-height:0; display:flex; align-items:center; justify-content:center; padding:0 14px; }
  .pads{ display:flex; flex-wrap:wrap; gap:10px; align-content:center; justify-content:center; }
  canvas{
    display:block; background:#fff; border-radius:22px; touch-action:none;
    box-shadow:0 5px 0 #ece2cd, 0 10px 22px rgba(120,90,40,.08);
  }
  /* ── tools ──────────────────────────────── */
  .tools{ display:flex; flex-direction:column; gap:9px; padding:10px 14px 2px; flex:0 0 auto; }
  .rowColors{ display:flex; align-items:center; gap:7px; }
  .rowColors #swatches{ display:flex; gap:7px; }
  .pickHint{ font-size:12px; font-weight:800; color:#b0956a; letter-spacing:-.2px; }
  .rowBtns{ display:flex; gap:8px; }
  .rowBtns .tbtn{ flex:1; justify-content:center; }
  .sw{
    width:34px; height:34px; border-radius:50%; border:3px solid #fff; padding:0;
    box-shadow:0 2px 6px rgba(30,40,60,.22); flex:0 0 auto; touch-action:manipulation;
  }
  .sw.rainbow{ background:conic-gradient(#ff3b30,#ffcc00,#34c759,#32ade6,#af52de,#ff3b30); }
  .sw.active{ box-shadow:0 0 0 3px #23272f, 0 2px 6px rgba(30,40,60,.3); transform:scale(1.04); }
  .tools .gap{ flex:1; }
  .tbtn{
    border:0; font-family:inherit; font-weight:900; font-size:12.5px; letter-spacing:-.2px;
    color:#3b4457; background:#fff; border-radius:13px; padding:10px 11px; box-shadow:0 3px 0 #e7ecf4;
    display:flex; align-items:center; gap:4px; white-space:nowrap; touch-action:manipulation;
  }
  .tbtn.on{ background:#e8fff0; color:#0f7a3c; box-shadow:0 3px 0 #c8f0d8; }
  .tbtn:active{ transform:translateY(2px); box-shadow:none; }
  /* ── done ───────────────────────────────── */
  .doneWrap{ padding:10px 14px calc(12px + env(safe-area-inset-bottom)); flex:0 0 auto; }
  .done{
    width:100%; border:0; font-family:inherit; font-size:19px; font-weight:900; letter-spacing:-.5px;
    color:#fff; padding:17px; border-radius:22px;
    background:linear-gradient(180deg,#4be07a,#21b355); box-shadow:0 6px 0 var(--green-dark);
    touch-action:manipulation;
  }
  .done:active{ transform:translateY(4px); box-shadow:0 2px 0 var(--green-dark); }
  .done.shake{ animation:shake .4s; }
  @keyframes shake{ 0%,100%{transform:translateX(0)} 25%{transform:translateX(-7px)} 75%{transform:translateX(7px)} }
  /* ── overlay & sheets ───────────────────── */
  .overlay{
    position:fixed; inset:0; z-index:60; display:flex; align-items:center; justify-content:center;
    background:rgba(24,28,38,.45); -webkit-backdrop-filter:blur(3px); backdrop-filter:blur(3px);
  }
  .overlay[hidden]{ display:none; }
  .pop{
    position:relative; width:min(86vw,360px); background:#fff; border-radius:32px; padding:24px 22px 20px;
    text-align:center; box-shadow:0 20px 40px rgba(0,0,0,.25); animation:pop .38s cubic-bezier(.2,1.5,.4,1);
    overflow:hidden;
  }
  @keyframes pop{ from{ transform:scale(.6) rotate(-6deg); opacity:0 } to{ transform:scale(1) rotate(0); opacity:1 } }
  .pop .ballbig{ width:96px; height:96px; margin:0 auto 6px; display:block; animation:spin 2.4s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg) } }
  .pop h2{ margin:6px 0 4px; font-size:24px; letter-spacing:-.8px; }
  .pop p{ margin:0 0 14px; font-size:14px; color:var(--muted); font-weight:800; line-height:1.35; }
  .pop .prize{
    display:inline-flex; align-items:center; gap:8px; background:#fff8e1; border:3px dashed #ffcf4d;
    border-radius:16px; padding:8px 14px; font-weight:900; font-size:15px; margin-bottom:14px;
  }
  .pop .prize img{ width:44px; height:44px; object-fit:contain; }
  .pop .next{
    display:flex; align-items:center; justify-content:center; gap:7px;
    font-size:12.5px; font-weight:900; color:#7a8496; letter-spacing:-.2px;
    margin:-2px 0 12px;
  }
  .pop .next .dot{ width:8px; height:8px; border-radius:50%; background:#34cf6e; animation:nextPulse 1s ease-in-out infinite; }
  @keyframes nextPulse{ 0%,100%{ opacity:.3; transform:scale(.8) } 50%{ opacity:1; transform:scale(1) } }

<script>
/* 도안 → 채색 미리보기 + 선화(라인아트) 생성. 외부 이미지 없이 100% 오프라인. */
window.HKArt = (function(){
  'use strict';
  var ART = window.__HKART__ || [];
  var byId = {};
  ART.forEach(function(a){ byId[a.id] = a; });

  var LINE_SIZE = 1024;   // 선화를 뽑아내는 해상도
  var OUT_SIZE  = 512;    // 보관하는 선화 크기 (부드러운 선)
  var DILATE    = 5;      // 선 굵기 (LINE_SIZE 기준 픽셀)
  var LINE_RGB  = [58, 54, 68];

  var uriCache = {}, imgCache = {}, lineCache = {};

  function dataUri(a){
    if(!uriCache[a.id]) uriCache[a.id] = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(a.svg);
    return uriCache[a.id];
  }
  function img(id){ return imgCache[id]; }
  function meta(id){ return byId[id]; }
  function list(){ return ART.slice(); }

  function preload(cb){
    var left = ART.length;
    if(!left){ if(cb) cb(); return; }
    ART.forEach(function(a){
      var im = new Image();
      var done = false;
      function fin(){ if(done) return; done = true; if(--left === 0 && cb) cb(); }
      im.onload = fin; im.onerror = fin;
      im.src = dataUri(a);
      imgCache[a.id] = im;
    });
  }

  function mask(src, S){
    var N = S*S, edge = new Uint8Array(N);
    var thr = 64, thrA = 32;
    for(var y=0;y<S;y++){
      var row = y*S;
      for(var x=0;x<S;x++){
        var i = row + x, p = i*4;
        var r1 = src[p], g1 = src[p+1], b1 = src[p+2], a1 = src[p+3];
        if(x+1 < S){
          var q = p+4;
          if(Math.abs(a1 - src[q+3]) > thrA){ edge[i] = 1; edge[i+1] = 1; }
          else if(a1 > 16 && (Math.abs(r1-src[q]) + Math.abs(g1-src[q+1]) + Math.abs(b1-src[q+2])) > thr){ edge[i] = 1; edge[i+1] = 1; }
        }
        if(y+1 < S){
          var t = p + S*4;
          if(Math.abs(a1 - src[t+3]) > thrA){ edge[i] = 1; edge[i+S] = 1; }
          else if(a1 > 16 && (Math.abs(r1-src[t]) + Math.abs(g1-src[t+1]) + Math.abs(b1-src[t+2])) > thr){ edge[i] = 1; edge[i+S] = 1; }
        }
      }
    }
    // 가로/세로 1차원 max 필터(반경 DILATE) 두 번 → 사각형 팽창, O(N)
    var tmp = new Uint8Array(N), out = new Uint8Array(N);
    var R = DILATE, i, x, y, row, acc;
    for(y=0;y<S;y++){
      row = y*S;
      acc = 0;
      for(x=0;x<S;x++){
        if(edge[row+x]) acc++;
        if(x-R-1 >= 0 && edge[row+x-R-1]) acc--;
        if(acc) tmp[row+x] = 1;
      }
      acc = 0;
      for(x=S-1;x>=0;x--){
        if(edge[row+x]) acc++;
        if(x+R+1 < S && edge[row+x+R+1]) acc--;
        if(acc) tmp[row+x] = 1;
      }
    }
    for(x=0;x<S;x++){
      acc = 0;
      for(y=0;y<S;y++){
        if(tmp[y*S+x]) acc++;
        if(y-R-1 >= 0 && tmp[(y-R-1)*S+x]) acc--;
        if(acc) out[y*S+x] = 1;
      }
      acc = 0;
      for(y=S-1;y>=0;y--){
        if(tmp[y*S+x]) acc++;
        if(y+R+1 < S && tmp[(y+R+1)*S+x]) acc--;
        if(acc) out[y*S+x] = 1;
      }
    }
    return out;
  }

  /* 선화 캔버스 (OUT_SIZE) — 없으면 만들어서 보관 */
  function line(id){
    if(lineCache[id]) return lineCache[id];
    var a = byId[id], im = imgCache[id];
    if(!a || !im || !im.complete) return null;
    var S = LINE_SIZE;
    var big = document.createElement('canvas'); big.width = big.height = S;
    var bx = big.getContext('2d', { willReadFrequently: true });
    bx.drawImage(im, 0, 0, S, S);
    var src;
    try{ src = bx.getImageData(0,0,S,S).data; }catch(e){ return null; }
    var m = mask(src, S);
    var lc = document.createElement('canvas'); lc.width = lc.height = S;
    var lx = lc.getContext('2d');
    var idata = lx.createImageData(S, S);
    var d = idata.data, n = S*S;
    for(var i=0;i<n;i++){
      if(m[i]){ var p = i*4; d[p] = LINE_RGB[0]; d[p+1] = LINE_RGB[1]; d[p+2] = LINE_RGB[2]; d[p+3] = 255; }
    }
    lx.putImageData(idata, 0, 0);
    big.width = big.height = 0;   // 원본 채색 버퍼는 바로 해제
    var sm = document.createElement('canvas'); sm.width = sm.height = OUT_SIZE;
    var sx = sm.getContext('2d');
    sx.imageSmoothingEnabled = true; sx.imageSmoothingQuality = 'high';
    sx.drawImage(lc, 0, 0, OUT_SIZE, OUT_SIZE);
    lc.width = lc.height = 0;
    lineCache[id] = sm;
    return sm;
  }

  function svgUri(id){ var a = byId[id]; return a ? dataUri(a) : ''; }

  return { list:list, meta:meta, preload:preload, img:img, line:line, svgUri:svgUri };
})();

<script>
(function(){
  'use strict';
  var D = window.__HG__;
  var NAMES = D.names, SLUGS = D.slugs, LETTERS = D.letters, POPULAR = D.popular;
  var $ = function(s){ return document.querySelector(s); };

  function ART(id){ return 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/' + id + '.png'; }
  function SPR(id){ return 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/' + id + '.png'; }
  function CRY(id){ return 'https://play.pokemonshowdown.com/audio/cries/' + SLUGS[id-1] + '.mp3'; }
  function nameOf(id){ return NAMES[id-1] || ''; }

  var COLORS = ['#ff3b30','#0a84ff','#ffcc00','#34c759','#af52de','rainbow'];

  /* ── storage ─────────────────────────────── */
  function sget(k, dflt){ try{ var v = localStorage.getItem(k); return v ? JSON.parse(v) : dflt; }catch(e){ return dflt; } }
  function sset(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
  var stickers = sget('hg.stickers.v1', {});
  var prefs = (function(){ var p = sget('hg.prefs.v1', {}) || {}; return { guide: p.guide !== false, color: p.color || '#ff3b30' }; })();

  var state = { mode: 'letter', li: 0, nid: 25, did: 25 };

  /* ── element helpers ─────────────────────── */
  function el(tag, cls, txt){ var e = document.createElement(tag); if(cls) e.className = cls; if(txt != null) e.textContent = txt; return e; }
  function imgTag(id, cls, art){
    var im = document.createElement('img');
    im.loading = 'lazy';
    im.decoding = 'async';
    im.alt = nameOf(id);
    im.src = art ? ART(id) : SPR(id);
    im.addEventListener('error', function(){
      if(!im.dataset.fb){ im.dataset.fb = '1'; im.src = art ? SPR(id) : ''; }
      else { im.style.visibility = 'hidden'; }
    });
    if(cls) im.className = cls;
    return im;
  }

  /* ── sound ───────────────────────────────── */
  var audioEl = null;
  /* 아이폰 Safari 는 손가락으로 처음 화면을 누른 그 순간에만 음성을 열어 줍니다.
     첫 터치에서 소리 없는 발음을 한 번 재생해 두면, 그 뒤로는 별표를 받은 뒤처럼
     언제든 말이 나옵니다. (아이폰에서 묵음이 되는 문제 방지) */
  var voiceReady = false;
  function unlockVoice(){
    try{
      if(voiceReady || !('speechSynthesis' in window)) return;
      voiceReady = true;
      var u = new SpeechSynthesisUtterance(' ');
      u.lang = 'ko-KR'; u.volume = 0; u.rate = 2;
      window.speechSynthesis.speak(u);
    }catch(e){}
  }
  function unlockAudio(){
    try{
      var AC = window.AudioContext || window.webkitAudioContext;
      if(AC){ actx = actx || new AC(); if(actx.state === 'suspended') actx.resume(); }
    }catch(e){}
  }
  document.addEventListener('pointerdown', function(){ unlockAudio(); unlockVoice(); }, true);
  document.addEventListener('touchstart', function(){ unlockAudio(); unlockVoice(); }, true);
  document.addEventListener('click', function(){ unlockAudio(); unlockVoice(); }, true);

  /* txt 를 읽어 주고, 다 읽으면 onEnd 를 부릅니다.
     아이폰에서 onend 가 오지 않는 경우가 있어, safetyMs 뒤에도 한 번만 부릅니다. */
  function speak(txt, onEnd, safetyMs){
    var fired = false;
    function once(){
      if(fired) return;
      fired = true;
      if(onEnd){ try{ onEnd(); }catch(e){} }
    }
    try{
      if(!('speechSynthesis' in window)){ once(); return null; }
      var syn = window.speechSynthesis;
      try{ if(syn.speaking || syn.pending) syn.cancel(); }catch(e){}
      var u = new SpeechSynthesisUtterance(txt);
      u.lang = 'ko-KR'; u.rate = 0.82; u.pitch = 1.12; u.volume = 1;
      if(onEnd) u.onend = function(){ once(); };
      u.onerror = function(){ if(onEnd) setTimeout(once, 60); };
      syn.speak(u);
      if(syn.paused){ try{ syn.resume(); }catch(e){} }
      if(onEnd && safetyMs) setTimeout(once, safetyMs);
      return u;
    }catch(e){ once(); return null; }
  }
  function playCry(id){
    try{
      if(audioEl){ audioEl.pause(); }
      audioEl = new Audio(CRY(id));
      audioEl.volume = 0.85;
      var p = audioEl.play();
      if(p && p.catch) p.catch(function(){});
      return audioEl;
    }catch(e){ return null; }
  }
  var actx = null;
  function chime(){
    try{
      var AC = window.AudioContext || window.webkitAudioContext;
      if(!AC) return;
      actx = actx || new AC();
      if(actx.state === 'suspended') actx.resume();
      var notes = [523.25, 659.25, 783.99, 1046.5];
      for(var i=0;i<notes.length;i++){
        (function(i){
          var o = actx.createOscillator(), g = actx.createGain();
          o.type = i === 3 ? 'triangle' : 'sine';
          o.frequency.value = notes[i];
          var t = actx.currentTime + i*0.105;
          g.gain.setValueAtTime(0.0001, t);
          g.gain.linearRampToValueAtTime(0.20, t+0.02);
          g.gain.exponentialRampToValueAtTime(0.0008, t+0.42);
          o.connect(g); g.connect(actx.destination);
          o.start(t); o.stop(t+0.46);
        })(i);
      }
    }catch(e){}
  }
  function buzz(ms){ try{ if(navigator.vibrate) navigator.vibrate(ms); }catch(e){} }

  /* ── pads ────────────────────────────────── */
  var pads = [];
  var dpr = Math.min(window.devicePixelRatio || 1, 3);

  function drawGrid(ctx, w, h, size){
    var r = Math.max(12, size*0.10);
    ctx.save();
    ctx.beginPath();
    if(ctx.roundRect){ ctx.roundRect(0, 0, w, h, r); } else { ctx.rect(0,0,w,h); }
    ctx.fillStyle = '#fff'; ctx.fill();
    ctx.lineWidth = 2; ctx.strokeStyle = '#eaeff7'; ctx.stroke();
    ctx.setLineDash([7, 7]); ctx.lineWidth = 2; ctx.strokeStyle = '#f0f4fa';
    ctx.beginPath();
    ctx.moveTo(w/2, 6); ctx.lineTo(w/2, h-6);
    ctx.moveTo(6, h/2); ctx.lineTo(w-6, h/2);
    ctx.stroke();
    ctx.restore();
  }

  var FONT_FAMILY = '"Apple SD Gothic Neo","Noto Sans CJK KR","Noto Sans KR","Malgun Gothic",sans-serif';
  var mctx = document.createElement('canvas').getContext('2d');
  var metricCache = {};
  function glyphFit(glyph, S){
    var r = metricCache[glyph];
    if(!r){
      mctx.font = '700 100px ' + FONT_FAMILY;
      var m = mctx.measureText(glyph);
      var L = m.actualBoundingBoxLeft || 0, R = m.actualBoundingBoxRight || m.width;
      var A = m.actualBoundingBoxAscent || 70, Dg = m.actualBoundingBoxDescent || 0;
      r = metricCache[glyph] = { w: Math.max(1, L + R), h: Math.max(1, A + Dg) };
    }
    var fs = Math.min(S*0.76/r.w, S*0.76/r.h) * 100;
    mctx.font = '700 ' + fs + 'px ' + FONT_FAMILY;
    var m2 = mctx.measureText(glyph);
    var L2 = m2.actualBoundingBoxLeft || 0, R2 = m2.actualBoundingBoxRight || fs*0.6;
    var A2 = m2.actualBoundingBoxAscent || fs*0.5, D2 = m2.actualBoundingBoxDescent || 0;
    return { fs: fs, x: S/2 + (L2 - R2)/2, y: S/2 + (A2 - D2)/2, w: L2 + R2, h: A2 + D2 };
  }
  var guideCache = {};
  function guideSprite(glyph, S, f){
    var key = glyph + '|' + Math.round(S) + '|' + dpr;
    if(guideCache[key]) return guideCache[key];
    var cv = document.createElement('canvas');
    cv.width = Math.round(S*dpr); cv.height = Math.round(S*dpr);
    var g = cv.getContext('2d');
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    g.textAlign = 'left'; g.textBaseline = 'alphabetic';
    g.font = '700 ' + f.fs + 'px ' + FONT_FAMILY;
    g.fillStyle = '#000';
    g.fillText(glyph, f.x, f.y);

    // dot mask on its own canvas, composited in a single pass
    var mask = document.createElement('canvas');
    mask.width = cv.width; mask.height = cv.height;
    var mg = mask.getContext('2d');
    mg.setTransform(dpr, 0, 0, dpr, 0, 0);
    mg.fillStyle = '#000';
    var step = Math.max(4.4, S*0.028), r = step*0.295;
    for(var yy = r, row = 0; yy < S + step; yy += step, row++){
      for(var xx = r + (row % 2 ? step/2 : 0); xx < S + step; xx += step){
        mg.beginPath(); mg.arc(xx, yy, r, 0, 6.2832); mg.fill();
      }
    }
    g.setTransform(1, 0, 0, 1, 0, 0);
    g.globalCompositeOperation = 'destination-in';
    g.drawImage(mask, 0, 0);
    g.globalCompositeOperation = 'source-in';
    g.fillStyle = 'rgba(72,114,170,.58)';
    g.fillRect(0, 0, cv.width, cv.height);
    g.globalCompositeOperation = 'source-over';
    guideCache[key] = cv;
    return cv;
  }
  function drawGuide(ctx, w, h, glyph){
    var S = Math.min(w, h);
    var f = glyphFit(glyph, S);
    var ox = (w - S)/2, oy = (h - S)/2;
    ctx.save();
    ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
    ctx.font = '700 ' + f.fs + 'px ' + FONT_FAMILY;
    ctx.fillStyle = 'rgba(120,150,190,.085)';
    ctx.fillText(glyph, ox + f.x, oy + f.y);
    ctx.restore();
    ctx.drawImage(guideSprite(glyph, S, f), ox, oy, S, S);
  }

  function drawStroke(ctx, s, w, h){
    var pts = s.pts, lw = Math.max(4, s.f * Math.min(w, h));
    ctx.save();
    ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.lineWidth = lw;
    if(pts.length === 1){
      ctx.fillStyle = s.color === 'rainbow' ? 'hsl(' + s.hue + ',88%,55%)' : s.color;
      ctx.beginPath(); ctx.arc(pts[0].x*w, pts[0].y*h, lw/2, 0, Math.PI*2); ctx.fill();
    } else {
      for(var i=1;i<pts.length;i++){
        var a = pts[i-1], b = pts[i];
        ctx.strokeStyle = s.color === 'rainbow' ? 'hsl(' + ((s.hue + i*7) % 360) + ',88%,55%)' : s.color;
        ctx.beginPath(); ctx.moveTo(a.x*w, a.y*h); ctx.lineTo(b.x*w, b.y*h); ctx.stroke();
      }
    }
    ctx.restore();
  }

  function redraw(pad){
    var ctx = pad.ctx, w = pad.size, h = pad.size;
    if(!w) return;
    ctx.clearRect(0, 0, w, h);
    drawGrid(ctx, w, h, w);
    if(pad.guide) drawGuide(ctx, w, h, pad.glyph);
    for(var i=0;i<pad.strokes.length;i++) drawStroke(ctx, pad.strokes[i], w, h);
  }

  function bindPad(pad){
    var cv = pad.cv, drawing = false, pid = null, cur = null;
    function pos(e){
      var r = cv.getBoundingClientRect();
      return { x: Math.min(1, Math.max(0, (e.clientX - r.left)/r.width)), y: Math.min(1, Math.max(0, (e.clientY - r.top)/r.height)) };
    }
    cv.addEventListener('pointerdown', function(e){
      if(drawing) return;
      e.preventDefault();
      drawing = true; pid = e.pointerId;
      try{ cv.setPointerCapture(pid); }catch(err){}
      cur = { color: prefs.color, hue: Math.floor(Math.random()*360), f: 0.062, pts: [pos(e)] };
      pad.strokes.push(cur);
      redraw(pad);
    }, { passive: false });
    cv.addEventListener('pointermove', function(e){
      if(!drawing || e.pointerId !== pid || !cur) return;
      e.preventDefault();
      var p = pos(e), last = cur.pts[cur.pts.length-1];
      if(Math.abs(p.x-last.x) + Math.abs(p.y-last.y) < 0.0035) return;
      cur.pts.push(p);
      redraw(pad);
    }, { passive: false });
    function end(e){
      if(pid !== null && e && e.pointerId !== undefined && e.pointerId !== pid) return;
      drawing = false; pid = null; cur = null;
    }
    cv.addEventListener('pointerup', end);
    cv.addEventListener('pointercancel', end);
    cv.addEventListener('pointerleave', function(e){ if(!cv.hasPointerCapture || !e.pointerId) end(); });
    cv.addEventListener('contextmenu', function(e){ e.preventDefault(); });
  }

  function newPad(glyph){
    var cv = el('canvas');
    var pad = { cv: cv, ctx: cv.getContext('2d'), glyph: glyph, strokes: [], guide: prefs.guide, size: 0 };
    bindPad(pad);
    return pad;
  }

  function setPadSize(pad, size){
    pad.size = size;
    pad.cv.style.width = size + 'px';
    pad.cv.style.height = size + 'px';
    pad.cv.width = Math.round(size * dpr);
    pad.cv.height = Math.round(size * dpr);
    pad.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    redraw(pad);
  }

  /* ── layout ──────────────────────────────── */
  function fit(){
    var stage = $('#stage');
    var W = Math.max(120, stage.clientWidth - 28);
    var H = Math.max(120, stage.clientHeight - 6);
    if(state.mode === 'draw'){ fitDraw(W, H); return; }
    if(!pads.length) return;
    if(state.mode === 'letter'){
      var s = Math.floor(Math.min(W, H, 560));
      setPadSize(pads[0], s);
      $('#pads').style.width = s + 'px';
    } else {
      var n = pads.length, gap = 10, cols = n, s2 = 0;
      for(var c=n; c>=1; c--){
        var rw = Math.ceil(n / c);
        var cand = Math.min((W - gap*(c-1))/c, (H - gap*(rw-1))/rw, 300);
        if(cand > s2 + 0.5){ s2 = cand; cols = c; }
      }
      s2 = Math.floor(s2);
      for(var k=0;k<pads.length;k++) setPadSize(pads[k], s2);
      $('#pads').style.width = (cols*s2 + gap*(cols-1)) + 'px';
    }
  }

  /* ── view: letters ───────────────────────── */
  function currentLetter(){ return LETTERS[state.li]; }

  function buildStrip(){
    var strip = $('#strip');
    strip.innerHTML = '';
    if(state.mode === 'draw'){ buildDrawStrip(); return; }
    if(state.mode === 'letter'){
      var addedVowel = false;
      strip.appendChild(el('span', 'grp', '자음'));
      LETTERS.forEach(function(L, i){
        if(L.t === 'vow' && !addedVowel){ addedVowel = true; strip.appendChild(el('span', 'grp', '모음')); }
        var b = el('button', 'chip' + (i === state.li ? ' active' : ''), L.c);
        b.type = 'button';
        b.dataset.i = i;
        b.setAttribute('aria-label', L.say);
        if(stickers['L:' + L.c]) b.appendChild(el('span', 'star', '⭐'));
        b.addEventListener('click', function(){ selectLetter(i); });
        strip.appendChild(b);
      });
    } else {
      POPULAR.forEach(function(id){
        var b = el('button', 'chip pk' + (id === state.nid ? ' active' : ''));
        b.type = 'button';
        b.dataset.id = id;
        b.appendChild(imgTag(id, '', false));
        b.appendChild(el('span', null, nameOf(id)));
        if(stickers['N:' + id]) b.appendChild(el('span', 'star', '⭐'));
        b.addEventListener('click', function(){ selectPokemon(id); });
        strip.appendChild(b);
      });
      var more = el('button', 'chip pk');
      more.type = 'button';
      more.appendChild(el('span', null, '🔍'));
      more.appendChild(el('span', null, '더 찾기'));
      more.addEventListener('click', openPicker);
      strip.appendChild(more);
    }
  }

  function selectLetter(i){
    cancelAutoNext();
    state.li = i; state.mode = 'letter';
    setDrawUI(false);
    var L = currentLetter();
    setTabs();
    buildStrip();
    scrollActiveChip();
    var pad = newPad(L.c);
    pads = [pad];
    var wrap = $('#pads');
    wrap.innerHTML = '';
    wrap.appendChild(pad.cv);
    updateBuddy(L.b, L.c, nameOf(L.b), L.say + ' · ' + L.tag);
    $('#sub').textContent = L.t === 'con' ? '자음 ' + L.c + ' · ' + L.say : '모음 ' + L.c + ' · ' + L.say;
    fit();
  }

  function selectPokemon(id){
    cancelAutoNext();
    state.nid = id; state.mode = 'name';
    setDrawUI(false);
    setTabs();
    buildStrip();
    scrollActiveChip();
    var nm = nameOf(id), chars = nm.split('');
    pads = chars.map(function(ch){ return newPad(ch); });
    var wrap = $('#pads');
    wrap.innerHTML = '';
    pads.forEach(function(p){ wrap.appendChild(p.cv); });
    updateBuddy(id, null, nm, chars.length + '글자 · 손가락으로 따라 써 보세요');
    $('#sub').textContent = nm + ' · ' + chars.length + '글자';
    fit();
  }

  function updateBuddy(id, big, name, tag){
    var art = $('#art');
    art.dataset.fb = '';
    art.src = ART(id);
    art.alt = nameOf(id);
    $('#bigLabel').textContent = big || '';
    $('#bigLabel').style.display = big ? 'block' : 'none';
    $('#pname').textContent = name;
    $('#ptag').textContent = tag || '';
  }

  function scrollActiveChip(){
    var c = $('#strip .chip.active');
    if(c && c.scrollIntoView) c.scrollIntoView({ inline: 'center', block: 'nearest', behavior: 'smooth' });
  }

  function setTabs(){
    Array.prototype.forEach.call(document.querySelectorAll('.tab'), function(t){
      t.classList.toggle('active', t.dataset.mode === state.mode);
    });
  }

  /* ── tools ───────────────────────────────── */
  function buildSwatches(){
    var box = $('#swatches');
    box.innerHTML = '';
    COLORS.forEach(function(c){
      var b = el('button', 'sw' + (c === 'rainbow' ? ' rainbow' : '') + (c === prefs.color ? ' active' : ''));
      b.type = 'button';
      b.dataset.c = c;
      b.setAttribute('aria-label', c === 'rainbow' ? '무지개' : '색연필');
      if(c !== 'rainbow') b.style.background = c;
      b.addEventListener('click', function(){
        prefs.color = c; sset('hg.prefs.v1', prefs);
        Array.prototype.forEach.call(box.children, function(x){ x.classList.toggle('active', x.dataset.c === c); });
      });
      box.appendChild(b);
    });
  }
  function totalStrokes(){ return pads.reduce(function(a,p){ return a + p.strokes.length; }, 0); }
  function undo(){
    for(var i=pads.length-1;i>=0;i--){
      if(pads[i].strokes.length){ pads[i].strokes.pop(); redraw(pads[i]); return; }
    }
  }
  function clearAll(){
    pads.forEach(function(p){ p.strokes.length = 0; redraw(p); });
    buzz(12);
  }
  function setGuide(on){
    prefs.guide = on; sset('hg.prefs.v1', prefs);
    pads.forEach(function(p){ p.guide = on; redraw(p); });
    var b = $('#hintBtn');
    b.textContent = on ? '힌트 끄기' : '힌트 켜기';
    b.classList.toggle('on', on);
  }

  /* ── celebration ─────────────────────────── */
  function confetti(host){
    var colors = ['#ff3b30','#ffcc00','#34c759','#32ade6','#af52de','#ff9500'];
    for(var i=0;i<28;i++){
      var s = document.createElement('i');
      s.style.left = Math.random()*100 + '%';
      s.style.background = colors[i % colors.length];
      s.style.animationDuration = (0.9 + Math.random()*0.9) + 's';
      s.style.animationDelay = (Math.random()*0.5) + 's';
      s.style.transform = 'rotate(' + (Math.random()*360) + 'deg)';
      host.appendChild(s);
    }
  }
  function ballSvg(){
    return '<svg class="ballbig" viewBox="0 0 100 100" aria-hidden="true">' +
      '<circle cx="50" cy="50" r="45" fill="#fff"/>' +
      '<path d="M5 50a45 45 0 0 1 90 0z" fill="#ef4123"/>' +
      '<rect x="5" y="46" width="90" height="8" fill="#222"/>' +
      '<circle cx="50" cy="50" r="15" fill="#fff" stroke="#222" stroke-width="7"/>' +
      '<circle cx="50" cy="50" r="45" fill="none" stroke="#222" stroke-width="6"/></svg>';
  }
  function celebrate(prizeHtml, msg, next){
    var pop = $('#pop');
    pop.innerHTML = '<div class="confetti"></div>' + ballSvg() +
      '<h2>참 잘했어요!</h2><p>' + msg + '</p>' +
      (prizeHtml ? '<div class="prize">' + prizeHtml + '</div>' : '') +
      '<div class="next" id="nextNote"' + (next ? '' : ' hidden') + '>' +
        '<span class="dot"></span><span id="nextText">' + (next ? next.text : '') + '</span>' +
      '</div>' +
      '<button type="button" id="popClose">계속 쓰기</button>';
    confetti(pop.querySelector('.confetti'));
    $('#celebrate').hidden = false;
    $('#popClose').addEventListener('click', function(){
      cancelAutoNext();               // 직접 계속 쓰면 자동 넘김은 멈춥니다
      $('#celebrate').hidden = true;
    });
  }

  /* ── 별표를 받으면 「참 잘했어요!」를 다 들려준 뒤 다음으로 ───── */
  var autoNext = 0, autoToken = 0;
  function cancelAutoNext(){
    autoToken++;                      // 대기 중이던 onend 연결도 함께 무효화
    if(autoNext){ clearTimeout(autoNext); autoNext = 0; }
    var n = $('#nextNote');
    if(n) n.style.display = 'none';
  }
  function nextTarget(){
    if(state.mode === 'letter'){
      var i = (state.li + 1) % LETTERS.length;
      return { mode: 'letter', i: i, text: '잠시 뒤 ' + LETTERS[i].c + ' 글자로 넘어가요' };
    }
    var id = null, k = POPULAR.indexOf(state.nid);
    if(k >= 0) id = POPULAR[(k + 1) % POPULAR.length];
    else {
      for(var j=0;j<POPULAR.length;j++){ if(POPULAR[j] > state.nid){ id = POPULAR[j]; break; } }
      if(id === null) id = POPULAR[0];
    }
    return { mode: 'name', id: id, text: '잠시 뒤 ' + nameOf(id) + '로 넘어가요' };
  }
  function scheduleNext(next, delay, token){
    if(!next || token !== autoToken) return;
    if(autoNext) clearTimeout(autoNext);
    autoNext = setTimeout(function(){
      autoNext = 0;
      if(token !== autoToken) return;
      $('#celebrate').hidden = true;
      if(next.mode === 'letter') selectLetter(next.i);
      else selectPokemon(next.id);
    }, delay);
  }
  /* 울음 → 「참 잘했어요!」 → (다 읽으면) 다음 글자 */
  function praiseThenNext(cryId, next, token){
    var praised = false;
    function praise(){
      if(praised) return;
      praised = true;
      speak('참 잘했어요!', function(){
        scheduleNext(next, 800, token);      // 칭찬이 끝나고 한 박자 뒤
      }, 2600);                              // onend 가 없어도 2.6초 뒤 넘어감
    }
    var a = playCry(cryId);
    if(a && a.addEventListener){
      a.addEventListener('ended', function(){ setTimeout(praise, 200); });
      setTimeout(praise, 1800);              // 울음이 길어도 칭찬은 이때부터
    } else {
      setTimeout(praise, 250);
    }
  }

  function complete(){
    if(state.mode === 'draw'){ completeDraw(); return; }
    if(totalStrokes() === 0){
      var b = $('#doneBtn');
      b.classList.remove('shake');
      void b.offsetWidth;
      b.classList.add('shake');
      speak('먼저 따라 써 볼까요?');
      return;
    }
    var key, prize, label, say;
    if(state.mode === 'letter'){
      var L = currentLetter();
      key = 'L:' + L.c;
      label = L.c + ' · ' + nameOf(L.b);
      prize = '<span style="font-size:26px">' + L.c + '</span><span>' + nameOf(L.b) + ' 스티커</span>';
      say = L.say + '! ' + nameOf(L.b) + '! 잘했어요!';
    } else {
      key = 'N:' + state.nid;
      label = nameOf(state.nid);
      prize = imgTag(state.nid, '', false).outerHTML + '<span>' + nameOf(state.nid) + ' 스티커</span>';
      say = nameOf(state.nid) + '! 잘했어요!';
    }
    var isNew = !stickers[key];
    if(isNew){
      stickers[key] = Date.now();
      sset('hg.stickers.v1', stickers);
    }
    updateCount();
    buildStrip();
    scrollActiveChip();
    cancelAutoNext();
    autoToken++; var token = autoToken;
    var next = nextTarget();
    chime();
    buzz(30);
    celebrate(prize, isNew ? '멋진 스티커를 받았어요! 하나 더 써 볼까요?' : '또 완성했어요! 정말 최고예요!', next);
    praiseThenNext(state.mode === 'letter' ? currentLetter().b : state.nid, next, token);
  }

  /* ── stickers ────────────────────────────── */
  function stickerList(){
    return Object.keys(stickers).map(function(k){ return { key: k, ts: stickers[k] }; }).sort(function(a,b){ return b.ts - a.ts; });
  }
  function updateCount(){
    $('#stickerCount').textContent = String(Object.keys(stickers).length);
  }
  function renderStickerSheet(){
    var g = $('#stickerGrid');
    g.innerHTML = '';
    var list = stickerList();
    $('#stickerSheetCount').textContent = list.length + '개';
    if(!list.length){
      var e = el('div', 'empty', '아직 스티커가 없어요.\n글자를 다 쓰고 초록 버튼을 눌러 스티커를 모아 보세요!');
      e.style.gridColumn = '1 / -1';
      e.style.whiteSpace = 'pre-line';
      g.appendChild(e);
      return;
    }
    list.forEach(function(it){
      var card = el('div', 'stCard');
      if(it.key.indexOf('L:') === 0){
        card.appendChild(el('div', 'em', it.key.slice(2)));
      } else if(it.key.indexOf('D:') === 0){
        var dim = document.createElement('img');
        dim.src = HKArt.svgUri(parseInt(it.key.slice(2), 10));
        dim.alt = nameOf(parseInt(it.key.slice(2), 10));
        card.appendChild(dim);
      } else {
        var id = parseInt(it.key.slice(2), 10);
        card.appendChild(imgTag(id, '', false));
      }
      var b = el('b', null, it.key.indexOf('L:') === 0 ? it.key.slice(2) + ' 스티커'
        : (it.key.indexOf('D:') === 0 ? nameOf(parseInt(it.key.slice(2), 10)) + ' 그림' : nameOf(parseInt(it.key.slice(2), 10))));
      card.appendChild(b);
      g.appendChild(card);
    });
  }

  /* ── picker ──────────────────────────────── */
  var pickerLimit = 60;
  var CHO = ['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
  function normQ(s){ return String(s || '').replace(/[\s\u00a0\u200b]+/g, '').toLowerCase(); }
  function isChoOnly(s){
    if(!s) return false;
    for(var i=0;i<s.length;i++){ if(CHO.indexOf(s.charAt(i)) < 0) return false; }
    return true;
  }
  function toCho(s){
    var out = '';
    for(var i=0;i<s.length;i++){
      var ch = s.charAt(i), code = ch.charCodeAt(0);
      if(code >= 0xAC00 && code <= 0xD7A3){ out += CHO[Math.floor((code - 0xAC00) / 588)]; }
      else { out += ch; }
    }
    return out;
  }
  /* 이름 검색: 띄어쓰기를 무시하고, 앞에서부터 맞는 이름을 먼저 보여 줍니다.
     ‘ㅍㅋ’ 같은 초성만으로도 찾을 수 있어요. */
  function matchNames(q){
    var query = normQ(q);
    var head = [], body = [];
    var i, nm;
    if(!query){
      for(i=1;i<=NAMES.length && head.length<pickerLimit;i++) head.push(i);
      return head;
    }
    for(i=1;i<=NAMES.length;i++){
      nm = normQ(NAMES[i-1]);
      if(!nm) continue;
      if(nm.indexOf(query) === 0) head.push(i);
      else if(nm.indexOf(query) > 0) body.push(i);
    }
    if(isChoOnly(query)){
      for(i=1;i<=NAMES.length;i++){
        nm = NAMES[i-1];
        if(!nm) continue;
        var ch = toCho(normQ(nm));
        if(ch.indexOf(query) !== 0) continue;
        if(head.indexOf(i) < 0 && body.indexOf(i) < 0) head.push(i);
      }
    }
    return head.concat(body).slice(0, pickerLimit);
  }

  /* ═══════════════ v4: 포켓몬 그림그리기 ═══════════════ */
  var DRAW_COLORS = [

  function fitDraw(W, H){
    var size = Math.floor(Math.min(W, H, 560));
    if(size < 140) size = 140;
    if(size === dstate.size) return;
    setupDrawCanvas(size);

  function dotPattern(ctx){
    var tile = document.createElement('canvas');
    var T = 9;
    tile.width = tile.height = T;
    var tc = tile.getContext('2d');
    tc.fillStyle = '#fff';
    tc.beginPath(); tc.arc(T/2, T/2, T*0.30, 0, 6.2832); tc.fill();
    try{ return ctx.createPattern(tile, 'repeat'); }catch(e){ return null; }
  }

  function paintOutline(){
    if(!dcv.ctxLine) return;
    var ctx = dcv.ctxLine, W = dstate.W, H = dstate.H;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, W, H);
    if(dstate.outline === 2) return;
    var art = HKArt.line(dstate.id);
    if(!art) return;
    ctx.save();
    ctx.globalAlpha = dstate.outline === 1 ? 0.72 : 1;
    ctx.imageSmoothingEnabled = true;
    ctx.drawImage(art, 0, 0, W, H);
    ctx.restore();
    if(dstate.outline === 1){
      ctx.save();
      ctx.globalCompositeOperation = 'destination-out';
      var pat = dotPattern(ctx);
      if(pat){ ctx.fillStyle = pat; ctx.fillRect(0, 0, W, H); }
      ctx.restore();
    }
  }

  function setupDrawCanvas(size){
    dstate.size = size;
    dstate.dpr = Math.min(window.devicePixelRatio || 1, 2);
    var dev = Math.round(size * dstate.dpr);
    dstate.W = dev; dstate.H = dev;
    var box = $('#drawBox');
    box.style.width = size + 'px';
    box.style.height = size + 'px';
    var fc = $('#fillCv'), lc = $('#lineCv');
    [fc, lc].forEach(function(c){
      c.style.width = size + 'px'; c.style.height = size + 'px';
      c.width = dev; c.height = dev;
    });
    dcv.fill = fc; dcv.line = lc;
    dcv.ctxFill = fc.getContext('2d'); dcv.ctxLine = lc.getContext('2d');
    paintOutline();
    buildRegions();
    replay();
  }

  /* 선화를 장애물로 보고 영역(라벨)을 나눕니다 — 페인트통이 한 번에 칠할 단위 */
  function buildRegions(){
    var W = dstate.W, H = dstate.H;
    if(!W || !H) return;
    var off = document.createElement('canvas');
    off.width = W; off.height = H;
    var oc = off.getContext('2d', { willReadFrequently: true });
    var art = HKArt.line(dstate.id);
    if(art) oc.drawImage(art, 0, 0, W, H);
    var data;
    try{ data = oc.getImageData(0, 0, W, H).data; }catch(e){ dregions = null; return; }
    var N = W * H;
    var labels = new Int32Array(N);
    var queue = new Int32Array(N);
    var cur = 0, i, s;
    for(s = 0; s < N; s++){
      if(data[s*4+3] > 72 || labels[s]) continue;
      cur++;
      var head = 0, tail = 0;
      queue[tail++] = s; labels[s] = cur;
      while(head < tail){
        var p = queue[head++];
        var x = p % W, q;
        if(x > 0){ q = p-1; if(!labels[q] && data[q*4+3] <= 72){ labels[q] = cur; queue[tail++] = q; } }
        if(x < W-1){ q = p+1; if(!labels[q] && data[q*4+3] <= 72){ labels[q] = cur; queue[tail++] = q; } }
        if(p >= W){ q = p-W; if(!labels[q] && data[q*4+3] <= 72){ labels[q] = cur; queue[tail++] = q; } }
        if(p < N-W){ q = p+W; if(!labels[q] && data[q*4+3] <= 72){ labels[q] = cur; queue[tail++] = q; } }
      }
    }
    dregions = { labels: labels, W: W, H: H, count: cur };
  }

  function labelAt(x, y){
    if(!dregions) return 0;
    var W = dstate.W, H = dstate.H, L = dregions.labels;
    if(x < 0 || y < 0 || x >= W || y >= H) return 0;
    var v = L[y*W + x];
    if(v) return v;
    for(var r = 1; r <= 14; r++){
      for(var dy = -r; dy <= r; dy++){
        if(dy !== -r && dy !== r) continue;
        for(var dx = -r; dx <= r; dx++){
          var xx = x + dx, yy = y + dy;
          if(xx < 0 || yy < 0 || xx >= W || yy >= H) continue;
          var q = L[yy*W + xx];
          if(q) return q;
        }
      }
      for(var dx2 = -r; dx2 <= r; dx2++){
        if(dx2 !== -r && dx2 !== r) continue;
        for(var dy2 = -r; dy2 <= r; dy2++){
          var xx2 = x + dx2, yy2 = y + dy2;
          if(xx2 < 0 || yy2 < 0 || xx2 >= W || yy2 >= H) continue;
          var q2 = L[yy2*W + xx2];
          if(q2) return q2;
        }
      }
    }
    return 0;
  }

  function maskFor(labelId){
    var key = dstate.id + '|' + dstate.W + '|' + labelId;
    if(dmaskCache[key]) return dmaskCache[key];
    if(!dregions) return null;
    var W = dstate.W, H = dstate.H, N = W*H, L = dregions.labels;
    var m = new Uint8Array(N);
    var minX = W, minY = H, maxX = 0, maxY = 0, i, x, y;
    /* 영역 + 선 밑으로 2px 더 들어가게 (실선 가장자리의 흰 틈 방지).
       다른 영역으로는 번지지 않습니다. */
    for(i = 0; i < N; i++){ if(L[i] === labelId) m[i] = 1; }
    for(var pass = 0; pass < 2; pass++){
      var add = [];
      for(i = 0; i < N; i++){
        if(m[i] || L[i]) continue;
        if((i >= W && m[i-W]) || (i < N-W && m[i+W]) || (i % W > 0 && m[i-1]) || (i % W < W-1 && m[i+1])) add.push(i);
      }
      if(!add.length) break;
      for(var k = 0; k < add.length; k++) m[add[k]] = 1;
    }
    for(i = 0; i < N; i++){
      if(m[i]){
        x = i % W; y = (i - x) / W;
        if(x < minX) minX = x; if(x > maxX) maxX = x;
        if(y < minY) minY = y; if(y > maxY) maxY = y;
      }
    }
    if(maxX < minX){ return null; }
    var cv = document.createElement('canvas'); cv.width = W; cv.height = H;
    var cx = cv.getContext('2d');
    var idata = cx.createImageData(W, H), d = idata.data;
    for(i = 0; i < N; i++){
      if(m[i]){ var p2 = i*4; d[p2] = 0; d[p2+1] = 0; d[p2+2] = 0; d[p2+3] = 255; }
    }
    cx.putImageData(idata, 0, 0);
    cv.__bbox = { x: minX, y: minY, w: maxX-minX+1, h: maxY-minY+1 };
    var keys = Object.keys(dmaskCache);
    if(keys.length > 16) delete dmaskCache[keys[0]];
    dmaskCache[key] = cv;
    return cv;
  }

  function paintFill(ctx, labelId, color){
    var mask = maskFor(labelId);
    if(!mask) return;
    var W = dstate.W, H = dstate.H;
    var t = document.createElement('canvas'); t.width = W; t.height = H;
    var tc = t.getContext('2d');
    tc.drawImage(mask, 0, 0);
    tc.globalCompositeOperation = 'source-in';
    if(color === 'rainbow'){
      var bb = mask.__bbox || { x:0, y:0, w:W, h:H };
      var g = tc.createLinearGradient(bb.x, bb.y, bb.x + bb.w, bb.y + bb.h);
      for(var i = 0; i <= 6; i++) g.addColorStop(i/6, 'hsl(' + (i*57) + ',92%,58%)');
      tc.fillStyle = g;
    } else {
      tc.fillStyle = color;
    }
    tc.fillRect(0, 0, W, H);
    ctx.drawImage(t, 0, 0);
    t.width = t.height = 0;
  }

  function pushAction(a){
    dstate.actions.length = dstate.ptr;
    dstate.actions.push(a);
    dstate.ptr = dstate.actions.length;
    undoRedoState();
  }
  function undoRedoState(){
    $('#undoDb').classList.toggle('off', dstate.ptr <= 0);
    $('#redoDb').classList.toggle('off', dstate.ptr >= dstate.actions.length);
  }

  function pathAdd(ctx, a, p0, p1, idx){
    var dpr = dstate.dpr;
    ctx.save();
    ctx.globalCompositeOperation = a.t === 'e' ? 'destination-out' : 'source-over';
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.lineWidth = a.w * dpr;
    ctx.strokeStyle = a.c === 'rainbow'
      ? 'hsl(' + ((a.hue + idx*7) % 360) + ',92%,58%)'
      : a.c;
    ctx.beginPath();
    ctx.moveTo(p0[0]*dpr, p0[1]*dpr);
    ctx.lineTo(p1[0]*dpr, p1[1]*dpr);
    ctx.stroke();
    ctx.restore();
  }

  function replay(){
    if(!dcv.ctxFill) return;
    var ctx = dcv.ctxFill, W = dstate.W, H = dstate.H;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, W, H);
    for(var i = 0; i < dstate.ptr; i++){
      var a = dstate.actions[i];
      if(!a) continue;
      if(a.t === 'f'){ paintFill(ctx, a.l, a.c); continue; }
      if(a.pts.length === 1){
        var dpr = dstate.dpr;
        ctx.save();
        ctx.globalCompositeOperation = a.t === 'e' ? 'destination-out' : 'source-over';
        ctx.fillStyle = a.c === 'rainbow' ? 'hsl(' + a.hue + ',92%,58%)' : a.c;
        ctx.beginPath();
        ctx.arc(a.pts[0][0]*dpr, a.pts[0][1]*dpr, a.w*dpr/2, 0, 6.2832);
        ctx.fill();
        ctx.restore();
        continue;
      }
      for(var k = 1; k < a.pts.length; k++) pathAdd(ctx, a, a.pts[k-1], a.pts[k], k);
    }
    undoRedoState();
  }

  function bindDraw(){
    var cv = $('#fillCv');
    var drawing = false, pid = null, cur = null;
    function pos(e){
      var r = cv.getBoundingClientRect();
      return [ (e.clientX - r.left), (e.clientY - r.top) ];
    }
    cv.addEventListener('pointerdown', function(e){
      if(drawing) return;
      e.preventDefault();
      if(dstate.tool === 'bucket'){ fillAt(pos(e)); return; }
      drawing = true; pid = e.pointerId;
      try{ cv.setPointerCapture(pid); }catch(err){}
      cur = {
        t: dstate.tool === 'eraser' ? 'e' : 's',
        c: dstate.color, w: DRAW_WIDTHS[dstate.width],
        hue: Math.floor(Math.random()*360), pts: [pos(e)]
      };
      pushAction(cur);
      var dpr = dstate.dpr, ctx = dcv.ctxFill;
      ctx.save();
      ctx.globalCompositeOperation = cur.t === 'e' ? 'destination-out' : 'source-over';
      ctx.fillStyle = cur.c === 'rainbow' ? 'hsl(' + cur.hue + ',92%,58%)' : cur.c;
      ctx.beginPath();
      ctx.arc(cur.pts[0][0]*dpr, cur.pts[0][1]*dpr, cur.w*dpr/2, 0, 6.2832);
      ctx.fill();
      ctx.restore();
    }, { passive: false });
    cv.addEventListener('pointermove', function(e){
      if(!drawing || !cur || e.pointerId !== pid) return;
      e.preventDefault();
      var p = pos(e), last = cur.pts[cur.pts.length-1];
      if(Math.abs(p[0]-last[0]) + Math.abs(p[1]-last[1]) < 1.6) return;
      cur.pts.push(p);
      pathAdd(dcv.ctxFill, cur, last, p, cur.pts.length);
    }, { passive: false });
    function end(e){
      if(pid !== null && e && e.pointerId !== undefined && e.pointerId !== pid) return;
      drawing = false; pid = null; cur = null;
    }
    cv.addEventListener('pointerup', end);
    cv.addEventListener('pointercancel', end);
    cv.addEventListener('contextmenu', function(e){ e.preventDefault(); });
  }

  function fillAt(p){
    var dpr = dstate.dpr;
    var x = Math.round(p[0]*dpr), y = Math.round(p[1]*dpr);
    var lab = labelAt(x, y);
    if(!lab) return;
    var a = { t: 'f', l: lab, c: dstate.color };
    pushAction(a);
    paintFill(dcv.ctxFill, lab, dstate.color);
    blip(); buzz(8);
  }

  function blip(){
    try{
      var AC = window.AudioContext || window.webkitAudioContext;
      if(!AC) return;
      actx = actx || new AC();
      if(actx.state === 'suspended') actx.resume();
      var o = actx.createOscillator(), g = actx.createGain();
      o.type = 'sine'; o.frequency.value = 880;
      var t = actx.currentTime;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(0.10, t + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0004, t + 0.16);
      o.connect(g); g.connect(actx.destination);
      o.start(t); o.stop(t + 0.18);
    }catch(e){}
  }

  function clearDraw(){
    dstate.actions = []; dstate.ptr = 0;
    replay(); buzz(12);
  }

  function toast(msg){
    var t = document.getElementById('toast');
    if(!t){ t = el('div'); t.id = 'toast'; document.body.appendChild(t); }
    t.textContent = msg;
    t.classList.add('on');
    clearTimeout(toast._t);
    toast._t = setTimeout(function(){ t.classList.remove('on'); }, 1900);
  }

  function savePng(){
    var W = dstate.W, H = dstate.H;
    if(!W){ return; }
    var out = document.createElement('canvas');
    out.width = W; out.height = H;
    var x = out.getContext('2d');
    x.fillStyle = '#ffffff'; x.fillRect(0, 0, W, H);
    if(dcv.fill) x.drawImage(dcv.fill, 0, 0);
    var art = HKArt.line(dstate.id);
    if(art) x.drawImage(art, 0, 0, W, H);
    var fname = nameOf(dstate.id) + '-그림.png';
    function go(url, revoke){
      try{
        var a = document.createElement('a');
        a.href = url; a.download = fname;
        document.body.appendChild(a); a.click();
        setTimeout(function(){
          if(a.parentNode) a.parentNode.removeChild(a);
          if(revoke) URL.revokeObjectURL(url);
        }, 2000);
        toast('그림을 저장했어요! 🖼');
      }catch(e){ toast('저장을 못 했어요'); }
    }
    try{
      if(out.toBlob){
        out.toBlob(function(b){
          if(b) go(URL.createObjectURL(b), true);
          else go(out.toDataURL('image/png'), false);
        }, 'image/png');
      } else {
        go(out.toDataURL('image/png'), false);
      }
    }catch(e){ toast('저장을 못 했어요'); }
  }

  function celebrateDraw(isNew){

        '<button type="button" id="popClose2" class="ghost">계속 그리기</button>' +
      '</div>';
    confetti(pop.querySelector('.confetti'));
    $('#celebrate').hidden = false;
    $('#popNext').addEventListener('click', function(){
      $('#celebrate').hidden = true;
      var list = HKArt.list(), k = -1;
      for(var i = 0; i < list.length; i++) if(list[i].id === dstate.id){ k = i; break; }
      var next = list[(k + 1) % list.length];
      selectDraw(next.id);
    });
    $('#popSave').addEventListener('click', savePng);
    $('#popClose2').addEventListener('click', function(){ $('#celebrate').hidden = true; });
  }

  function completeDraw(){
    if(!dstate.actions.length){
      var b = $('#doneBtn');
      b.classList.remove('shake'); void b.offsetWidth; b.classList.add('shake');
      speak('먼저 색칠해 볼까요?');
      return;
    }
    var key = 'D:' + dstate.id;
    var isNew = !stickers[key];
    if(isNew){ stickers[key] = Date.now(); sset('hg.stickers.v1', stickers); }
    updateCount();
    buildDrawStrip();
    scrollActiveChip();
    chime(); buzz(30);
    celebrateDraw(isNew);
    praiseDraw(dstate.id);
  }

  function initDraw(){
    buildDrawSwatches();
    bindDraw();
    setTool('brush'); setWidth(1); outlineLabel();
    $('#brushBtn').addEventListener('click', function(){ setTool('brush'); });
    $('#bucketBtn').addEventListener('click', function(){ setTool('bucket'); });
    $('#eraserBtn').addEventListener('click', function(){ setTool('eraser'); });
    $('#undoDb').addEventListener('click', function(){
      if(dstate.ptr > 0){ dstate.ptr--; replay(); }
    });
    $('#redoDb').addEventListener('click', function(){
      if(dstate.ptr < dstate.actions.length){ dstate.ptr++; replay(); }
    });
    $('#outlineBtn').addEventListener('click', function(){
      dstate.outline = (dstate.outline + 1) % 3;
      paintOutline(); outlineLabel();
    });
    Array.prototype.forEach.call(document.querySelectorAll('#toolsDraw .wbtn'), function(b){
      b.addEventListener('click', function(){ setWidth(+b.dataset.w); });
    });
    $('#clearDrawBtn').addEventListener('click', clearDraw);
    HKArt.preload(function(){
      if(state.mode === 'draw' && dstate.W){
        paintOutline(); buildRegions(); replay();
      }
    });
  }

  Array.prototype.forEach.call(document.querySelectorAll('.tab'), function(t){
    t.addEventListener('click', function(){
      if(t.dataset.mode === 'letter') selectLetter(state.li);
      else if(t.dataset.mode === 'name') selectPokemon(state.nid);
      else selectDraw(state.did);
    });
  });
  $('#sayBtn').addEventListener('click', function(){
    if(state.mode === 'draw'){ speak(nameOf(dstate.id)); return; }
    if(state.mode === 'letter'){
      var L = currentLetter();
      speak(L.say + '. ' + nameOf(L.b));
    } else {
      speak(nameOf(state.nid));
    }
  });
  $('#cryBtn').addEventListener('click', function(){
    playCry(state.mode === 'draw' ? dstate.id : (state.mode === 'letter' ? currentLetter().b : state.nid));
  });
  $('#undoBtn').addEventListener('click', undo);
  $('#clearBtn').addEventListener('click', clearAll);
  $('#hintBtn').addEventListener('click', function(){ setGuide(!prefs.guide); });
  $('#doneBtn').addEventListener('click', complete);
  $('#stickerBtn').addEventListener('click', function(){ renderStickerSheet(); $('#stickerSheet').hidden = false; });
  /* 아이폰 한글 입력: 조합 중에는 글자가 늦게 들어오므로
     input/compositionend/search/keyup 을 모두 받아 한 박자 뒤에 읽습니다. */
  var pkTimer = 0, pkComposing = false;
  function pkRun(){
    clearTimeout(pkTimer);
    pkTimer = setTimeout(function(){
      renderPicker($('#pkSearch').value);
    }, pkComposing ? 240 : 110);
  }
  var pkInput = $('#pkSearch');
  pkInput.addEventListener('input', pkRun);
  pkInput.addEventListener('keyup', pkRun);
  pkInput.addEventListener('search', pkRun);
  pkInput.addEventListener('change', pkRun);
  pkInput.addEventListener('compositionstart', function(){ pkComposing = true; });
  pkInput.addEventListener('compositionend', function(){ pkComposing = false; pkRun(); });
  pkInput.addEventListener('keydown', function(e){ if(e.key === 'Enter'){ pkRun(); } });
  $('#pkClear').addEventListener('click', function(){
    pkInput.value = '';
    renderPicker('');
    try{ pkInput.focus(); }catch(e){}
  });
  Array.prototype.forEach.call(document.querySelectorAll('[data-close]'), function(b){
    b.addEventListener('click', function(){ $('#' + b.dataset.close).hidden = true; });
  });
  Array.prototype.forEach.call(document.querySelectorAll('.sheet'), function(s){
    s.addEventListener('click', function(e){ if(e.target === s) s.hidden = true; });
  });

  var rt;
  window.addEventListener('resize', function(){ clearTimeout(rt); rt = setTimeout(fit, 120); });
  window.addEventListener('orientationchange', function(){ setTimeout(fit, 260); });

  /* ── boot ────────────────────────────────── */
  updateCount();
  buildSwatches();
  setGuide(prefs.guide);
  initDraw();
  selectLetter(0);
})();
